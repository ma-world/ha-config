name: HA Config Sync
version: "4.6.1"
slug: ha_config_sync
description: Backs up Home Assistant configuration to Git. Open Web UI for status, active rule preview, logs, cache reset, and the repository link.
url: https://github.com/ma-world/ha-config
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:file-document-edit-outline
panel_title: HA Config Sync Status
panel_admin: false
map:
  - homeassistant_config:rw
  - app_config:rw
  - all_app_configs:rw
options:
  repository_url: https://github.com/<YOUR USER NAME>/homeassistant-config-files.git
  branch: main
  git_name: Home Assistant Config Sync
  git_email: home-assistant@local
  github_token: ""
  include_secrets: false
  include_dashboards: true
  sync_interval_hours: 4
  include_all_app_configs: false
schema:
  repository_url: str
  branch: str
  git_name: str
  git_email: email
  github_token: password
  include_secrets: bool
  include_dashboards: bool
  sync_interval_hours: int(1,168)
  include_all_app_configs: bool
