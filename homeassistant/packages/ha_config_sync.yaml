automation:
  - id: ha_config_sync_every_four_hours
    alias: "HA Config Sync – alle 4 Stunden"
    description: "Startet das lokale Add-on, das die Konfiguration nach Git sichert."
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/4"
    actions:
      - action: hassio.addon_start
        data:
          addon: local_ha_config_sync
    mode: single
